[tool.poetry]
name = "devp"
version = "0.1.0"
description = "A simple, TOML-configured process multiplexer TUI."
authors = ["thefr0gg <ramsy0dev@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "devp"}]

[tool.poetry.dependencies]
python = "^3.11"
textual = "^8.2.8"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^1.4.0"

[tool.poetry.scripts]
devp = "devp.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
